<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182e28">
  <meta name="description" content="Explore three islands, grow your wind abilities, and bring the light home in an original third-person adventure.">
  <title>Number Islands · The Last Light</title>
  <link rel="stylesheet" href="voyage/voyage.css">
  <link rel="icon" href="icons/islands-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script defer src="voyage/entry.js"></script>
  <script defer src="pwa.js"></script>
</head>
<body>
  <main id="game-shell">
    <canvas id="world" aria-label="The three-dimensional island" tabindex="0" data-voyage-look></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <section class="hud" id="hud" hidden aria-label="Voyage status">
      <div class="hud-location"><span aria-hidden="true">✦</span><div><p id="region-name"></p><span id="hud-route"></span></div></div>
      <div id="quest-hud">
        <p id="objective" aria-live="polite"></p>
        <div class="quest-load" id="quest-load" hidden>
          <span id="counterweight"></span>
          <div id="load-meter" role="presentation"></div>
        </div>
      </div>
      <div id="quest-compass" class="quest-compass" aria-label="Direction to the next objective">
        <span id="bearing" aria-hidden="true">▴</span><span id="distance"></span>
      </div>
      <div class="rank-strip">
        <span id="rank-name"></span><span class="rank-xp" id="rank-xp"></span>
        <span id="skills"></span>
      </div>
      <p id="carry-status" class="carry-status" hidden></p>
      <p id="notice" class="notice" aria-live="polite" hidden></p>
      <div class="interaction" id="interaction" hidden><kbd>E</kbd><span></span></div>
      <div class="touch-controls">
        <div data-voyage-stick class="move-stick" aria-hidden="true"><span data-voyage-thumb></span></div>
        <div class="touch-actions">
          <button type="button" data-voyage-jump aria-label="Jump or glide">↑</button>
          <button type="button" data-voyage-action aria-label="Interact">✦</button>
        </div>
      </div>
      <p class="quick-controls">WASD move <span>·</span> Drag to look <span>·</span> E interact <span>·</span> Space jump</p>
    </section>
    <div id="chapter-banner" class="chapter-banner" aria-live="polite" hidden><p></p><h1></h1><span></span></div>
    <div id="paused" class="paused" hidden>Voyage paused <span>Press Esc to continue</span></div>
    <div id="load-message" class="load-message" role="status">Approaching the coast…</div>
    <noscript><p class="no-script">Turn on JavaScript to explore Alderreach.</p></noscript>
  </main>
</body>
</html>
